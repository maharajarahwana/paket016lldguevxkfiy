  {"id": 3, "type": "mcq", "text": "[3 – 4] 다음 질문에 답하십시오.<p>3. 다음 단어와 관계있는 것은 고르십시오.<p>점, 사진, 도장, 영화", "options": ["깎다", "찍다", "보다", "따다"], "answer": 2},
  {"id": 4, "type": "mcq", "text": "4. 다음 단어의 비슷한 말은 무엇입니까 ?<p>(값을) 오리다", "options": ["올라가다", "인상하다", "변화하다", "내리다"], "answer": 2},
  {"id": 5, "type": "mcq", "text": "[5 – 8] 빈칸에 들어갈 가장 알맞은 것을 고르십시오.<p>5. 저는 고향에 있는 가족이 생각날 때..........을/를 봅니다. 가족들 얼굴을 보면 기분이 좀 좋아집니다." , "options": ["사진", "액자", "영화", "통장"], "answer": 1},
  {"id": 6, "type": "mcq", "text": "6. 퇴근 후에 모임이 있다고 하면 보통 회식을 떠올립니다. 하지만 요즘은 회식 대신에 같이 공연을..........운동을 하기도 합니다.", "options": ["보려고", "보거나", "알리려고", "알리거나"], "answer": 2},

  {"id": 8, "type": "mcq", "text": "8. 기숙사 복도에 물건을 두지 마십시오. 물건이 있으면 지저분해 보이기도 하고 걸려서 넘어지면..........", "options": ["델 뻔했습니다", "델 수 도 있습니다", "다칠 수 뻔했습니다", "다칠 수도 있습니다"], "answer": 4},
  {"id": 9, "type": "mcq_img", "text": "[9 – 12] 다음 질문에 답하십시오.<p>9. 다음 약 봉투에 대한 설명으로 맞는 것은 무엇입니까?", "img": "9.jpg", "options": ["먹는 약과 바르는 약이 있습니다.", "약사 이름은 ‘김기태’입니다.", "약을 먹고 30 분후에 밥을 먹습니다.", "이틀 동안 먹는 약이 들었습니다."], "answer": 4},
  {"id": 10, "type": "mcq_img", "text": "10. 다음 그래프에 대한 설명으로 맞는 것을 고르십시오.", "img": "10.jpg", "options": ["외국인이 영화감상과 음악감상을 가장 적게 좋아합니다.", "외국인이 가장 좋아하는 취미는 독서입니다.", "외국인이 비디오게임을 두 번째로 많이 좋아합니다.", "외국인이 독서보다 비디오 게임을 두 배 더 좋아합니다."], "answer": 2},
  {"id": 11, "type": "mcq_img", "text": "11. 다음에 그래프에 대한 설면으로 맞는 것은 무엇입니까 ?", "img": "11.jpg", "options": ["뛰어난 풍경보다 교통이 편리하다는 대답이 더 많다.", "아름다운 경치 때문에 방문하는 사람들이 가장 많다.", "겨울연가의 촬영지이어서 가장 많은 사람들이 방문한다.", "기타 명소로 남이섬을 방문하는 사람이 두 번째로 많다."], "answer": 2},
  {"id": 12, "type": "mcq_img", "text": "12. 다음에 그래프에 대한 설면으로 맞는 것은 무엇입니까?", "img": "12.jpg", "options": ["40~49 세 외국인이 한식 인기가 세 번째로 적습니다.", "30~39 세 외국인이 한식 인기가 가장 많습니다.", "18~29 세 외국인이 한식 인기가 50~59 세보다 더 많습니다.", "60 세 이상인 외국인이 한식 인기가 가장 적습니다."], "answer": 3},
  {"id": 13, "type": "mcq", "text": "[13 – 14] 빈칸에 들어갈 가장 알맞은 것을 고르십시오.<p>13. 이 창고에는 담당 직원이 아니면 들어갈 수 없습니다. 출입을..........담당 직원에게 먼저 연락하시기 바랍니다.", "options": ["원하시면", "운하니까", "하시면", "하시니까"], "answer": 1},
  {"id": 14, "type": "mcq", "text": "14. 한국은 제조산업이 발달해서 수준이 많이 하는 나라 입니다. 한국은 제조산업을 중심으로 경제반전을..........", "options": ["시키는 편입니다", "만들어야 합니다", "만드는 편입니다", "시켜야 합니다"], "answer": 1},
  {"id": 15, "type": "mcq", "text": "[15 – 16] 다음 글을 읽고 무엇에 대한 글인지 고르십시오.<p>15. 지난 한 해 동안 음료수의 판매 결과를 보면 주스가 제일 많이 팔렸고 생수가 그 뒤를 이었습니다. 10 년 전과 비교해 보면 콜라, 사이다 같은 탄산 음료의 비중은 절반으로 줄어든 대신 다른 음료의 판매가 두 배 이상 늘어난 겁니다.", "options": ["음료수의 종류", "음료수의 생산 과정", "음료수 성분의 차이", "음료수의 판매율 변화"], "answer": 4},
  {"id": 16, "type": "mcq", "text": "16. 여름철에 즐기는 한국의 전통 음식으로, 차가운 콩국에 국수를 말아 먹는 요리입니다. 주로 흰콩를 삶아 갈아서 만든 콩국에 소금으로 간을 맞추고, 잘 삶아낸 국수를 넣어 먹습니다. 시원하고 고소한 맛이 특징이며, 오이, 토마토, 계란 등의 고명을 함께 곁들여 먹습니다.", "options": ["감자탕", "콩국수", "쌀국수", "칡국수"], "answer": 2},
  {"id": 17, "type": "mcq", "text": "[17 – 18] 다음 글을 읽고 내용과 같은 것을 고르십시오.<p>17. 닭싸움는 두 마리의 수탉(수컷 닭)이 서로 싸움을 벌이는 활동을 나타냅니다. 한 마리의 수탉이 다른 한 마리를 무력화시키거나 죽일 때까지 경합을 벌이는 것이 주된 목적입니다. 닭싸움은 일부 지역에서 역사적이고 전통적인 의미가 있다고 주장하는 사람들도 있지만, 도덕적이고 동물 복지 문제로 인해 많은 국가에서 불법으로 여겨지며, 많은 국가에서는 이를 금지하고 대한민국도 포함됩니다.", "options": ["수탉하고 암탉을 싸움을 벌이게 하는 것입니다.", "한국에서 닭싸움을 합법적인 입니다.", "한국에서 닭싸음을 반대하는 사람이 없습니다.", "다른 한 마리 닭을 죽이거나 무력화 시키면 경기를 이깁니다."], "answer": 4},
  {"id": 18, "type": "mcq", "text": "18. 한국 음식의 기본은 밥과 국, 그리고 여러 가지 반찬이다. 대체로 이것들을 한상에 차려 놓고 숟가락과 젓가락을 사용하여 같이 먹는다. 한식은 밥과 반찬을 먹기 때문에 다양한 영양소를 고루 섭취할 수 있어서 건강을 유지하는 데 좋다. 한국인의 주식은 밥이다. 밥은 쌀을 재료로 하여짓는 것으로 한국의 가장 기본적인 음식이다. 한국인이 밥을 먹을 때에는 국과 반찬을 함께 먹는다. 국은 보통 고기, 생선, 채소 등 다양한 재료로 만들어서 끓여 먹지만, 여름에는 시원하게 해서 먹는 경우도 있다.", "options": ["한국 음식의 기본은 면과 빵, 그리고 소스입니다.", "한국인의 주식은 쌀로 지은 밥입니다.", "여름에는 국을 따뜻하게 먹는 경우가 많습니다.", "한국인은 보통 숟가락과 젓가락을 사용하지 않습니다."], "answer": 2},
  {"id": 19, "type": "mcq", "text": "[19 – 20] 다음 설명에 알맞은 어휘를 고르십시오.<p>19. 미래의 재해나 질병 등에 대하여 금전적 보상을 받기 위해 정해진 기간 동안 일정한 돈을 납부해 적립해 두는 제도 입니다.", "options": ["저촉", "보험", "월급", "벌금"], "answer": 2},
  {"id": 20, "type": "mcq", "text": "20. 정신적으로나 유체적으로 아무 탈이 없고 점점 더 튼튼한 상태로 나아가는 것 입니다.", "options": ["건강 검진", "스트레칭", "등반 대회", "건강 증진"], "answer": 4},

  {"id": 25, "type": "mcq_audio_img_mix", "text": "[ 25 – 29 ] 그림을 보고 알맞은 대답을 고르십시오.<p>25. 이것은 무엇입니까 ?", "audio": "25.mp3", "img": "25.jpg", "audio_options": ["25a1.mp3", "25a2.mp3", "25a3.mp3", "25a4.mp3"], "answer": 4},
  {"id": 26, "type": "mcq_audio_img_mix", "text": "26. 여기는 어디입니까 ?", "audio": "26.mp3", "img": "26.jpg", "audio_options": ["26a1.mp3", "26a2.mp3", "26a3.mp3", "26a4.mp3"], "answer": 4},
  {"id": 27, "type": "mcq_audio_img_mix", "text": "27. 이 사람은 지금 무엇을 하고 있습니까 ?", "audio": "27.mp3", "img": "27.jpg", "audio_options": ["27a1.mp3", "27a2.mp3", "27a3.mp3", "27a4.mp3"], "answer": 2},
  {"id": 28, "type": "mcq_audio_img_mix", "text": "28. 얼마나 있어요?", "audio": "28.mp3", "img": "28.jpg", "audio_options": ["28a1.mp3", "28a2.mp3", "28a3.mp3", "28a4.mp3"], "answer": 2},
  {"id": 29, "type": "mcq_audio_img_mix", "text": "29. 서점이 어디에 있어요?", "audio": "29.mp3", "img": "29.jpg", "audio_options": ["29a1.mp3", "29a2.mp3", "29a3.mp3", "29a4.mp3"], "answer": 4},
  {"id": 30, "type": "mcq_audio", "text": "[ 30 – 33 ] 다음을 듣고 질문에 알맞은 대답을 고르십시오.<p>30.", "audio": "30.mp3", "options": ["오늘 같이 친구를 만납시다.", "어제 친구를 세 시에 만났어요.", "행복 마트에서 만나요.", "오후 두 시에 만나요."], "answer": 4},
  {"id": 31, "type": "mcq_audio", "text": "31.", "audio": "31.mp3", "options": ["네, 저기 야구장이 있어요.", "네, 저는 축구를 좋아해요.", "아니요, 저는 야구를 안 좋아해요.", "네, 항상 운동해요."], "answer": 3},
  {"id": 32, "type": "mcq_audio", "text": "32.", "audio": "32.mp3", "options": ["네, 거기 행복마트가 있어요.", "아니요, 행복마트에 세일 있어요.", "은행 옆에 행복마트가 있어요.", "어제 저도 행복마트에 갔어요."], "answer": 3},
  {"id": 33, "type": "mcq_audio", "text": "33.", "audio": "33.mp3", "options": ["배편으로 보내면 한달 정도 걸려요.", "먼저 소포를 달아야 합니다.", "국제 특급으로 소포를 보낸 적이 있어요?", "서비스로 보내면 삼일 정도 걸려요."], "answer": 1},
  {"id": 34, "type": "mcq_audio", "text": "[ 34 – 35 ] 다음을 듣고 이어지는 말을 고르십시오.<p>34.", "audio": "34.mp3", "options": ["수리 센터 전화번호 좀 찾아보세요.", "빨래 양을 늘려서 다시 해 봐야겠네요.", "고장 난 세탁기는 버리고 새 세탁기를 삽시다.", "세탁기를 관 회사가 수리해 주는 것은 당연해요."], "answer": 2},

  {"id": 36, "type": "mcq_audio_img", "text": "[ 36 – 37 ] 잘 듣고 들은 내용과 관계있는 그림을 고르십시오.<p>36.", "audio": "36.mp3", "img_options": ["36a1.jpg", "36a2.jpg", "36a3.jpg", "36a4.jpg"], "answer": 2},
  {"id": 37, "type": "mcq_audio_img", "text": "37.", "audio": "37.mp3", "img_options": ["37a1.jpg", "37a2.jpg", "37a3.jpg", "37a4.jpg"], "answer": 1},
  {"id": 38, "type": "mcq_audio", "text": "[ 38 – 40 ] 이야기를 듣고 질문에 알맞은 대답을 고르십시오.<p>38. 여자가 이어서 할 행동으로 가장 알맞은 것을 고르십시오.", "audio": "38.mp3", "options": ["은행에 간다.", "전을 부친다.", "시장에 간다.", "세뱃돈을 준다."], "answer": 2},
  {"id": 39, "type": "mcq_audio", "text": "39. 다음을 듣고 여자의 중심 생각을 고르십시오.", "audio": "39.mp3", "options": ["남자를 계속 기다릴 겁니다.", "남자가 늦어서 기분이 나쁩니다.", "남자를 기다리게 해서 미안합니다.", "남자와 다른 날에 만나고 싶습니다."], "answer": 4},
  {"id": 40, "type": "mcq_audio", "text": "40. 대화를 듣고 내용과 같은 것을 고르십시오.", "audio": "40.mp3", "options": ["두 사람은 미술관에서 같이 일해요.", "남자는 미술관에서 시잔을 찍었어요.", "미술관의 직원은 남자입니다.", "여자는 남자에게 사진기를 빌려 줘요."], "answer": 3}];
  
const ASSET_PATH = "assets/";
let answers = {};
let current = 0;
let submitted = false;
let totalSeconds = 50*60;
let timerInterval = null;
let audioPlayed = {};
let playingAudio = null;

function pad(n){return n<10? "0"+n:n;}

function startTimer(){
  const timerEl = document.getElementById('timer');
  function tick(){
    if(totalSeconds<=0){ clearInterval(timerInterval); autoSubmit(); return; }
    totalSeconds--;
    let m = Math.floor(totalSeconds/60);
    let s = totalSeconds%60;
    timerEl.textContent = pad(m)+":"+pad(s);
  }
  timerInterval = setInterval(tick,1000);
  tick();
}

function renderQNumbers(){
  const container = document.getElementById('qnumbers');
  container.innerHTML = "";
  questions.forEach((q,i)=>{
    const btn = document.createElement('button');
    btn.textContent = i+1;
    btn.title = "Ke soal "+(i+1);
    btn.addEventListener('click',()=> showPage(i));
    container.appendChild(btn);
  });
}

function renderPages(){
  const pages = document.getElementById('pages');
  pages.innerHTML = "";
  questions.forEach((q,i)=>{
    const page = document.createElement('section');
    page.className = "page";
    page.id = "page-"+i;
    page.setAttribute('data-index', i);
    let html = "<h3>Halaman "+(i+1)+"</h3>";
    html += "<div class='question-text'>"+(q.text? q.text.replace(/\n/g,'<br>'):'')+"</div>";
    if(q.img && q.type === "mcq_img") {
    html += '<img src="'+ASSET_PATH+q.img+'" class="question-img" alt="Gambar soal '+(i+1)+'">';
}
    if(q.type && q.type.includes("audio")) html += '<div style="margin-top:8px;"><button class="audioPlayOnce" data-audio="'+(q.audio||'')+'">Play Audio</button></div>';
    html += '<div class="options">';
    if(q.type === "mcq" || q.type === "mcq_img" || q.type === "mcq_audio"){
      q.options.forEach((opt,idx)=>{
        html += '<div class="option" data-choice="'+(idx+1)+'" tabindex="0"><span class="label">'+(idx+1)+'.</span><span class="opt-text">'+opt+'</span></div>';
      });
    } else if(q.type === "mcq_audio_img"){
      q.img_options.forEach((opt,idx)=>{
        html += '<div class="option" data-choice="'+(idx+1)+'" tabindex="0"><img src="'+ASSET_PATH+opt+'" class="img-option" alt="Pilihan '+(idx+1)+'"></div>';
      });
    } else if(q.type === "mcq_audio_img_mix"){
      if(q.img) html += '<img src="'+ASSET_PATH+q.img+'" class="question-img" alt="Gambar soal '+(i+1)+'">';
      q.audio_options.forEach((aud,idx)=>{
        html += '<div class="option" data-choice="'+(idx+1)+'" tabindex="0"><button class="audioPlayOnce" data-audio="'+aud+'">Play option '+(idx+1)+'</button></div>';
      });
    } else if(q.type === "mcq_audio_options"){
      q.audio_options.forEach((aud,idx)=>{
        html += '<div class="option" data-choice="'+(idx+1)+'" tabindex="0"><button class="audioPlayOnce" data-audio="'+aud+'">Play option '+(idx+1)+'</button></div>';
      });
    }
    html += "</div>";
    page.innerHTML = html;
    pages.appendChild(page);
  });

  // attach interactions
  document.querySelectorAll('.option').forEach(opt=>{
    opt.addEventListener('click', (e)=>{
      if(submitted) return;
      const choice = parseInt(opt.getAttribute('data-choice'));
      const page = opt.closest('.page');
      const idx = parseInt(page.getAttribute('data-index'));
      page.querySelectorAll('.option').forEach(o=>o.classList.remove('selected'));
      opt.classList.add('selected');
      answers[idx+1] = choice;
      let btn = document.querySelectorAll('#qnumbers button')[idx];
btn.style.backgroundColor = '#007bff';   // biru full
btn.style.color = '#ffffff';             // tulisan putih agar jelas
btn.style.borderColor = '#007bff';       // border ikut biru
  });
    opt.addEventListener('keypress', (e)=>{ if(e.key==='Enter'){ opt.click(); } });
  });

  // audio play once
  function handleAudioButton(btn){
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const src = btn.getAttribute('data-audio');
      if(!src) return;
      if(audioPlayed[src]){ alert('Audio hanya bisa diputar satu kali.'); return; }
      if(playingAudio){ try{ playingAudio.pause(); }catch{} }
      const aud = new Audio(ASSET_PATH + src);
      playingAudio = aud;
      aud.play().catch(()=>{ alert('Gagal memutar audio. Pastikan file ada.'); });
      audioPlayed[src] = true;
      btn.disabled = true;
      btn.textContent = "Played";
      aud.addEventListener('ended', ()=> { playingAudio = null; });
    });
  }
  document.querySelectorAll('.audioPlayOnce').forEach(handleAudioButton);
}

function showPage(i){
  if(i<0) i=0;
  if(i>=questions.length) i=questions.length-1;
  current = i;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const p = document.getElementById('page-'+i);
  if(p) p.classList.add('active');
  // Highlight halaman aktif
document.querySelectorAll('#qnumbers button').forEach((btn, idx)=>{
    if(idx === i){
        btn.style.border = "3px solid red";    // border merah tebal
    } else {
        btn.style.border = "1px solid #ccc";   // kembali normal
    }
});
  document.getElementById('prevBtn').disabled = (i===0);
  document.getElementById('nextBtn').disabled = (i===questions.length-1);
}

document.getElementById('prevBtn').addEventListener('click', ()=> showPage(current-1));
document.getElementById('nextBtn').addEventListener('click', ()=> showPage(current+1));
document.getElementById('submitBtn').addEventListener('click', submitQuiz);

function calculateScore(){
  let score = 0;
  questions.forEach((q,idx)=>{
    const user = answers[idx+1];
    if(user && user === q.answer) score++;
  });
  return score;
}

function lockAnswers(){
  submitted = true;

  document.querySelectorAll('.page').forEach((page, idx)=>{
    const q = questions[idx];
    const correct = q.answer;

    const options = page.querySelectorAll('.option');
    options.forEach((opt)=>{
      const choice = parseInt(opt.getAttribute('data-choice'));

      // Kunci opsi
      opt.classList.add('disabled');

      // Jika benar → hijau
      if(choice === correct){
        opt.style.background = "#d4f8d4";
        opt.style.borderColor = "#2ecc71";
      }

      // Jika dipilih tapi salah → merah
      if(answers[idx+1] === choice && choice !== correct){
        opt.style.background = "#ffd6d6";
        opt.style.borderColor = "#e74c3c";
      }
    });
  });

  // Nonaktifkan audio
  document.querySelectorAll('#qnumbers button')[idx].style.borderColor = '#008cff';      // biru tebal
document.querySelectorAll('#qnumbers button')[idx].style.backgroundColor = '#cfe9ff';  // biru muda
}

function submitQuiz(){
  if(!confirm("Yakin ingin submit?")) return;
  if(submitted) return;
  clearInterval(timerInterval);
  const score = calculateScore();
  const box = document.getElementById('scoreBox');
  box.style.display = "block";
  box.innerHTML = "<strong>Skor Anda: "+score+" / "+questions.length+"</strong>";
  lockAnswers();
  box.scrollIntoView({behavior:'smooth'});
}

function autoSubmit(){
  if(submitted) return;
  submitted = true;            // kunci agar tidak double submit
  clearInterval(timerInterval);
  const score = calculateScore();
  const box = document.getElementById('scoreBox');
  box.style.display = "block";
  box.innerHTML = "<strong>Skor Anda: "+score+" / "+questions.length+"</strong>";
  lockAnswers();
  box.scrollIntoView({behavior:'smooth'});
}

window.addEventListener('load', ()=>{ renderQNumbers(); renderPages(); showPage(0); startTimer(); });
</script>
</body>
